name: Windows paketi

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  testler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  paket:
    needs: testler
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/build_windows_package.py
      - uses: actions/upload-artifact@v4
        with:
          name: ParaninZamanMaliyeti-Windows
          path: dist/ParaninZamanMaliyeti-Windows.zip
          retention-days: 90

  windows-dogrulama:
    needs: paket
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ParaninZamanMaliyeti-Windows
      - name: Paketi aç
        shell: pwsh
        run: Expand-Archive ParaninZamanMaliyeti-Windows.zip -DestinationPath C:\pzm
      - name: Baslat.bat ile başlat ve uçtan uca dene
        shell: pwsh
        run: |
          $dir = "C:\pzm\ParaninZamanMaliyeti"
          $p = Start-Process -FilePath "$dir\Baslat.bat" -ArgumentList "--no-browser" -PassThru -WindowStyle Hidden `
               -RedirectStandardOutput C:\pzm\out.log -RedirectStandardError C:\pzm\err.log
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            try { $h = Invoke-RestMethod http://127.0.0.1:8000/api/saglik; if ($h.durum -eq "calisiyor") { $ok = $true; break } } catch {}
            Start-Sleep -Seconds 1
          }
          Get-Content C:\pzm\out.log, C:\pzm\err.log -ErrorAction SilentlyContinue
          if (-not $ok) { throw "Sunucu başlamadı" }

          $s = New-Object Microsoft.PowerShell.Commands.WebRequestSession
          $body = @{ kullanici_adi = "erkan"; ad_soyad = "Erkan"; parola = "gizli-parola"; ilk_firma = "Alfa A.Ş." } | ConvertTo-Json
          Invoke-RestMethod -Method Post http://127.0.0.1:8000/api/kurulum -Body ([Text.Encoding]::UTF8.GetBytes($body)) -ContentType "application/json; charset=utf-8" -WebSession $s | Out-Null
          $vade = (Get-Date).ToUniversalTime().AddHours(3).Date.AddDays(240).ToString("yyyy-MM-dd")
          $calc = @{ nominal = "1000000"; vade_tarihi = $vade; yillik_oran = "40" } | ConvertTo-Json
          $r = Invoke-RestMethod -Method Post http://127.0.0.1:8000/api/hesap/deger -Body $calc -ContentType "application/json" -WebSession $s
          Write-Host "Bugunku deger:" $r.sonuc.bugunku_deger
          if ($r.sonuc.bugunku_deger -ne "801522.67") { throw "Hesap sonucu beklenenden farkli" }
          $f = Invoke-RestMethod http://127.0.0.1:8000/api/firmalar -WebSession $s
          Write-Host "Firma:" $f[0].ad
          $html = Invoke-WebRequest http://127.0.0.1:8000/ -UseBasicParsing
          if ($html.StatusCode -ne 200) { throw "Arayuz acilmadi" }
          if (-not (Test-Path "$dir\veri\pzm.db")) { throw "Veritabani dosyasi olusmadi" }
          Write-Host "Veritabani:" (Get-Item "$dir\veri\pzm.db").Length "bayt"
          Write-Host "WINDOWS PAKETI DOGRULANDI"

  kur-ve-calistir:
    # Kur-ve-Calistir.bat'i gerçek Windows'ta dener: PowerShell sözdizimi, GitHub'dan
    # indirme (zip ve git), taşınabilir Python, paket kurulumu, başlatma, ikinci açılışta
    # güncelleme ve logolu kurulum penceresi (ekran görüntüsü yapıt olarak saklanır).
    runs-on: windows-latest
    env:
      PZM_DAL: ${{ github.head_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: Kur-ve-Calistir.bat
          sparse-checkout-cone-mode: false
      - name: PowerShell sözdizimi (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $kod = [IO.File]::ReadAllText("$PWD\Kur-ve-Calistir.bat", [Text.Encoding]::UTF8)
          $hatalar = $null
          [void][Management.Automation.Language.Parser]::ParseInput($kod, [ref]$null, [ref]$hatalar)
          if ($hatalar) { $hatalar | Format-List | Out-String | Write-Host; throw "Sozdizimi hatasi" }
          $ilk = [IO.File]::ReadAllBytes("$PWD\Kur-ve-Calistir.bat")[0..2]
          if ($ilk[0] -eq 0xEF) { throw "Dosya BOM ile baslamamali" }
          Write-Host "Sozdizimi temiz"
      - name: Zip, git ve güncelleme senaryoları (pencere olmadan)
        shell: pwsh
        run: |
          Copy-Item Kur-ve-Calistir.bat C:\Kur-ve-Calistir.bat
          $env:PZM_ARAYUZSUZ = "1"
          function Dene($klasor, $gitYok, $ad) {
            $env:PZM_KLASOR = $klasor
            $env:PZM_GIT_KULLANMA = $gitYok
            $log = "C:\$ad.log"
            $p = Start-Process -FilePath C:\Kur-ve-Calistir.bat -ArgumentList "--no-browser" -PassThru -WindowStyle Hidden `
                 -RedirectStandardOutput $log -RedirectStandardError "$log.err"
            $ok = $false
            for ($i = 0; $i -lt 600; $i++) {
              try { $h = Invoke-RestMethod http://127.0.0.1:8000/api/saglik; if ($h.durum -eq "calisiyor") { $ok = $true; break } } catch {}
              if ($p.HasExited) { break }
              Start-Sleep -Seconds 1
            }
            $kurulum = Get-Content "$klasor\kurulum.log" -Raw -Encoding utf8 -ErrorAction SilentlyContinue
            Write-Host "----- $ad -----"
            Write-Host $kurulum
            Get-Content $log, "$log.err" -ErrorAction SilentlyContinue | Out-Host
            if (-not $ok) { throw "$ad : sunucu başlamadı" }
            if (-not (Test-Path "$klasor\veri\pzm.db")) { throw "$ad : veritabanı veri klasöründe oluşmadı" }
            Get-CimInstance Win32_Process -Filter "Name='python.exe'" | ForEach-Object { Stop-Process -Id $_.ProcessId -Force }
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 2
            return $kurulum
          }
          Dene "C:\pzm-zip" "1" "zip-ilk" | Out-Null
          if (-not (Test-Path "C:\pzm-zip\kaynak\app\launcher.py")) { throw "zip ile kaynak inmedi" }
          if (-not (Test-Path "C:\pzm-zip\Kur-ve-Calistir.bat")) { throw "bat kurulum klasörüne kopyalanmadı" }
          $ikinci = Dene "C:\pzm-zip" "1" "zip-guncelleme"
          if ($ikinci -notmatch "Paketler güncel") { throw "ikinci açılışta paketler yeniden kuruldu" }
          if ($ikinci -notmatch "Python hazır") { throw "ikinci açılışta Python yeniden indi" }
          Dene "C:\pzm-git" "0" "git-ilk" | Out-Null
          if (-not (Test-Path "C:\pzm-git\kaynak\.git")) { throw "git ile klonlanmadı" }
          Dene "C:\pzm-git" "0" "git-guncelleme" | Out-Null
          Write-Host "KUR-VE-CALISTIR DOGRULANDI"
      - name: Kurulum penceresi (ekran görüntüsü)
        shell: pwsh
        run: |
          Remove-Item Env:PZM_ARAYUZSUZ -ErrorAction SilentlyContinue
          $env:PZM_KLASOR = "C:\pzm-zip"
          $env:PZM_GIT_KULLANMA = "1"
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          function Ekran($ad) {
            $b = [Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object Drawing.Bitmap $b.Width, $b.Height
            $g = [Drawing.Graphics]::FromImage($bmp); $g.CopyFromScreen($b.Location, [Drawing.Point]::Empty, $b.Size)
            New-Item -ItemType Directory -Force C:\ekran | Out-Null
            $bmp.Save("C:\ekran\$ad.png"); $g.Dispose(); $bmp.Dispose()
          }
          Start-Process -FilePath C:\Kur-ve-Calistir.bat -ArgumentList "--no-browser"
          Start-Sleep -Seconds 2; Ekran "1-kurulum"
          $ok = $false
          for ($i = 0; $i -lt 180; $i++) {
            try { $h = Invoke-RestMethod http://127.0.0.1:8000/api/saglik; if ($h.durum -eq "calisiyor") { $ok = $true; break } } catch {}
            Start-Sleep -Seconds 1
          }
          Start-Sleep -Seconds 2; Ekran "2-calisiyor"
          Get-Content C:\pzm-zip\kurulum.log -Encoding utf8 | Out-Host
          if (-not $ok) { throw "Pencereli başlatmada sunucu başlamadı" }
          if (-not (Test-Path "$([Environment]::GetFolderPath('Desktop'))\Paranın Zaman Maliyeti.lnk")) { throw "Masaüstü kısayolu oluşmadı" }
          # Kısayol ile ikinci açılış: program zaten çalıştığı için yeni sunucu açmamalı
          Start-Process "$([Environment]::GetFolderPath('Desktop'))\Paranın Zaman Maliyeti.lnk"
          Start-Sleep -Seconds 6; Ekran "3-kisayol"
          $n = @(Get-CimInstance Win32_Process -Filter "Name='python.exe'").Count
          Write-Host "Calisan python sayisi: $n"
          if ($n -ne 1) { throw "Kısayol ikinci bir sunucu başlattı" }
          Get-CimInstance Win32_Process -Filter "Name='python.exe'" | ForEach-Object { Stop-Process -Id $_.ProcessId -Force }
          Write-Host "PENCERE DOGRULANDI"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kurulum-penceresi-ekran
          path: C:\ekran
          retention-days: 14
