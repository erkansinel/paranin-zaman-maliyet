<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Paranın Zaman Maliyeti · Decisora</title>
  <meta name="description" content="Vadeli çek ve senetlerin bugünkü ekonomik değerini hesaplayan finansal karar destek sistemi.">
  <link rel="icon" type="image/png" href="/static/brand/favicon.png">
  <link rel="stylesheet" href="/static/styles.css">
  <script src="/static/vendor/chart-4.4.4.umd.js"></script>
  <script src="/static/app.js"></script>
  <script defer src="/static/vendor/alpine-3.14.1.min.js"></script>
</head>
<body x-data="app" x-cloak>

<!-- ================= Giriş / Kurulum ================= -->
<template x-if="!booting && !user">
  <div class="auth">
    <div class="auth-art">
      <div class="decisora on-dark">
        <img src="/static/brand/decisora-amblem.png" alt="Decisora" class="decisora-emblem">
        <div><div class="wordmark">Deci<span>sora</span></div><div class="wordmark-sub">DANIŞMANLIK A.Ş.</div></div>
      </div>
      <div style="position:relative; z-index:1">
        <div class="app-kicker">Paranın Zaman Maliyeti</div>
        <h2>Gelecekteki tahsilatınız bugün kaç TL ediyor?</h2>
        <p>Çek ve senetlerinizi bugünkü ekonomik değerleriyle görün; iskonto oranlarını, peşin teklifleri ve portföyünüzün zaman maliyetini tek ekranda karşılaştırın.</p>
        <div class="formula">PV = FV ÷ (1 + r)<sup>d/365</sup></div>
      </div>
      <div class="brand-sub" style="position:relative; z-index:1">Vadeli evrak değerleme ve finansal karar destek sistemi · © Decisora Danışmanlık A.Ş.</div>
    </div>
    <div class="auth-form">
      <div class="card">
        <img src="/static/brand/decisora-logo.png" alt="Decisora Danışmanlık A.Ş." class="auth-logo">
        <template x-if="needsSetup">
          <form @submit.prevent="doSetup()">
            <h3 style="font-size:20px; margin-bottom:6px">İlk kurulum</h3>
            <p class="muted" style="margin:0 0 20px">Yönetici hesabını oluşturun. Firmaları ve diğer kullanıcıları daha sonra ekleyebilirsiniz.</p>
            <div class="alert" x-show="auth.error" x-text="auth.error"></div>
            <div class="field"><label>Ad soyad</label><input class="input" x-model="auth.ad_soyad" required></div>
            <div class="field"><label>Kullanıcı adı</label><input class="input" x-model="auth.kullanici_adi" autocomplete="username" required></div>
            <div class="field"><label>Parola</label><input class="input" type="password" x-model="auth.parola" autocomplete="new-password" required><span class="help">En az 8 karakter.</span></div>
            <div class="field" x-show="setupKeyRequired"><label>Kurulum anahtarı</label><input class="input" type="password" x-model="auth.anahtar"><span class="help">Sunucu kurulurken belirlenen PZM_KURULUM_ANAHTARI değeri.</span></div>
            <div class="field"><label>İlk firma (isteğe bağlı)</label><input class="input" x-model="auth.ilk_firma" placeholder="Ör. Alfa Tekstil A.Ş."></div>
            <button class="btn btn-primary btn-block" type="submit">Kurulumu tamamla</button>
          </form>
        </template>
        <template x-if="!needsSetup">
          <form @submit.prevent="doLogin()">
            <h3 style="font-size:20px; margin-bottom:6px">Giriş yap</h3>
            <p class="muted" style="margin:0 0 20px">Hesabınızla oturum açın.</p>
            <div class="alert" x-show="auth.error" x-text="auth.error"></div>
            <div class="field"><label>Kullanıcı adı</label><input class="input" x-model="auth.kullanici_adi" autocomplete="username" required></div>
            <div class="field"><label>Parola</label><input class="input" type="password" x-model="auth.parola" autocomplete="current-password" required></div>
            <button class="btn btn-primary btn-block" type="submit">Giriş yap</button>
          </form>
        </template>
      </div>
    </div>
  </div>
</template>

<!-- ================= Uygulama ================= -->
<template x-if="user">
<div class="shell">
  <div class="scrim" x-show="menuOpen" @click="menuOpen=false"></div>
  <aside class="sidebar" :class="menuOpen && 'open'">
    <div class="brand">
      <img src="/static/brand/decisora-amblem.png" alt="Decisora" class="decisora-emblem sm">
      <div><div class="brand-title">Paranın Zaman<br>Maliyeti</div><div class="brand-sub">Decisora Danışmanlık A.Ş.</div></div>
    </div>
    <div class="nav-label">Ana ekran</div>
    <template x-for="key in ['panel','hesap','portfoy','oran','pesin','rapor','ayar']" :key="key">
      <button class="nav-item" :class="page===key && 'active'" @click="go(key)">
        <span x-html="icon(PAGES[key].icon)"></span><span x-text="PAGES[key].title"></span>
      </button>
    </template>
    <div class="side-foot">
      <div class="side-user">
        <div class="avatar" x-text="initials(user.ad_soyad)"></div>
        <div style="min-width:0; flex:1">
          <div style="color:#fff; font-weight:600; font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap" x-text="user.ad_soyad"></div>
          <div x-text="user.yonetici ? 'Yönetici' : 'Kullanıcı'"></div>
        </div>
        <button class="icon-btn" title="Çıkış" @click="logout()" x-html="icon('logout')" style="color:#8b92b8"></button>
      </div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" @click="menuOpen=true" x-html="icon('menu')" aria-label="Menü"></button>
      <div style="min-width:0">
        <h1 x-text="PAGES[page].title"></h1>
        <div class="sub" x-text="PAGES[page].sub"></div>
      </div>
      <div class="spacer"></div>
      <select class="input company-select" style="width:auto; min-width:160px" :value="companyId" @change="selectCompany($event.target.value)" x-show="companies.length">
        <template x-for="c in companies" :key="c.id"><option :value="c.id" x-text="c.ad" :selected="c.id===companyId"></option></template>
      </select>
      <button class="icon-btn" @click="toggleTheme()" :title="theme==='dark' ? 'Açık tema' : 'Koyu tema'" x-html="icon(theme==='dark' ? 'sun' : 'moon')"></button>
    </header>

    <div class="content">

      <!-- Firma yoksa uyarı -->
      <template x-if="!companies.length && ['panel','portfoy','rapor'].includes(page)">
        <div class="card empty">
          <div class="ic" x-html="icon('wallet')"></div>
          <h3>Henüz firma yok</h3>
          <p x-text="user.yonetici ? 'Portföy oluşturmak için önce bir firma ekleyin.' : 'Yöneticinizin size bir firma ataması gerekiyor.'"></p>
          <button class="btn btn-primary" x-show="user.yonetici" @click="go('ayar'); $nextTick(()=>openCompany(null))">Firma ekle</button>
        </div>
      </template>

      <!-- ================= GENEL BAKIŞ ================= -->
      <section x-show="page==='panel' && companies.length">
        <div class="grid g-4" x-show="port">
          <div class="card kpi accent">
            <div class="label">Toplam nominal alacak</div>
            <div class="val num" x-text="port && fmtTL(port.toplam_nominal)"></div>
            <div class="foot" x-text="port && (port.adet + ' evrak · ' + port.firma)"></div>
          </div>
          <div class="card kpi">
            <div class="label"><span class="dot" style="background:var(--value)"></span>Bugünkü ekonomik değer</div>
            <div class="val num value" x-text="port && fmtTL(port.toplam_bugunku_deger)"></div>
            <div class="foot" x-text="port && ('Değerleme: ' + fmtDate(port.degerleme_tarihi))"></div>
          </div>
          <div class="card kpi">
            <div class="label"><span class="dot" style="background:var(--cost)"></span>Toplam zaman maliyeti</div>
            <div class="val num cost" x-text="port && fmtTL(port.toplam_zaman_maliyeti)"></div>
            <div class="foot" x-text="port && ('Nominalin ' + fmtPct(port.deger_kaybi_yuzde) + ' kadarı')"></div>
          </div>
          <div class="card kpi">
            <div class="label"><span class="dot" style="background:var(--primary)"></span>Ortalama vade</div>
            <div class="val num" x-text="port && (port.agirlikli_ortalama_vade_gun !== null ? prettyTR(port.agirlikli_ortalama_vade_gun) + ' gün' : '—')"></div>
            <div class="foot" x-text="port && port.ortalama_vade_gun !== null ? ('Tutar ağırlıklı · basit ort. ' + prettyTR(port.ortalama_vade_gun) + ' gün') : 'Portföy boş'"></div>
          </div>
        </div>

        <div class="grid g-3" style="margin-top:20px">
          <template x-for="k in ['hesap','portfoy','oran','pesin','rapor','ayar']" :key="k">
            <button class="card tile" @click="go(k)">
              <div class="ic" :style="{hesap:'background:#edf0f6;color:#404f6c',portfoy:'background:#e3f5f0;color:#1f9580',oran:'background:#fef5e6;color:#d97706',pesin:'background:#e6f2f3;color:#3f8f92',rapor:'background:#eef1f7;color:#5f7396',ayar:'background:#f1f5f9;color:#475569'}[k]" x-html="icon(PAGES[k].icon)"></div>
              <h4 x-text="PAGES[k].title"></h4>
              <p x-text="PAGES[k].sub"></p>
            </button>
          </template>
        </div>

        <div class="grid g-2" style="margin-top:20px" x-show="port && port.adet">
          <div class="card">
            <div class="card-h"><h3>Aylara göre tahsilat beklentisi</h3><span class="hint">Nominal ve bugünkü değer</span></div>
            <div class="chart-box"><canvas id="p_monthlyChart"></canvas></div>
          </div>
          <div class="card">
            <div class="card-h"><h3>Vade dağılımı</h3><span class="hint">Nominal tutara göre</span></div>
            <div class="chart-box"><canvas id="p_bucketChart"></canvas></div>
          </div>
        </div>
      </section>

      <!-- ================= YENİ HESAPLAMA ================= -->
      <section x-show="page==='hesap'">
        <div class="grid g-calc">
          <form class="card" @submit.prevent="runCalc()">
            <div class="card-h"><h3>Evrak bilgileri</h3></div>
            <div class="field">
              <label>Evrak türü</label>
              <div class="seg">
                <button type="button" :class="calc.evrak_turu==='cek' && 'on'" @click="calc.evrak_turu='cek'">Çek</button>
                <button type="button" :class="calc.evrak_turu==='senet' && 'on'" @click="calc.evrak_turu='senet'">Senet</button>
              </div>
            </div>
            <div class="field">
              <label>Nominal tutar</label>
              <div class="input-affix"><input class="input num" :class="calcErr && calcErr.field==='nominal' && 'invalid'" x-model="calc.nominal" @blur="blurPretty(calc,'nominal')" inputmode="decimal" placeholder="1.000.000,00"><span class="affix">TL</span></div>
              <span class="err" x-show="calcErr && calcErr.field==='nominal'" x-text="calcErr && calcErr.message"></span>
            </div>
            <div class="two">
              <div class="field">
                <label>Düzenleme / teslim tarihi</label>
                <input class="input" type="date" x-model="calc.duzenleme_tarihi">
              </div>
              <div class="field">
                <label>Vade (tahsilat) tarihi</label>
                <input class="input" type="date" :class="calcErr && calcErr.field==='vade_tarihi' && 'invalid'" x-model="calc.vade_tarihi">
              </div>
            </div>
            <div class="field" style="margin-top:-6px">
              <div class="quick">
                <template x-for="d in [30,60,90,120,180,240,365]"><button type="button" @click="setDays(calc,d)" x-text="d+' gün'"></button></template>
                <button type="button" @click="setMonths(calc,8)">8 ay</button>
              </div>
              <span class="err" x-show="calcErr && calcErr.field==='vade_tarihi'" x-text="calcErr && calcErr.message"></span>
            </div>
            <div class="field">
              <label>Yıllık iskonto oranı</label>
              <div class="input-affix"><input class="input num" :class="calcErr && calcErr.field==='yillik_oran' && 'invalid'" x-model="calc.yillik_oran" inputmode="decimal"><span class="affix">%</span></div>
              <span class="err" x-show="calcErr && calcErr.field==='yillik_oran'" x-text="calcErr && calcErr.message"></span>
            </div>
            <div class="field">
              <label>Hesaplama yöntemi</label>
              <div class="seg">
                <button type="button" :class="calc.yontem==='bilesik' && 'on'" @click="calc.yontem='bilesik'">Bileşik iskonto</button>
                <button type="button" :class="calc.yontem==='basit' && 'on'" @click="calc.yontem='basit'">Basit iskonto</button>
              </div>
            </div>
            <div class="field">
              <label>Değerleme tarihi</label>
              <div class="seg">
                <button type="button" :class="calc.degerleme_esasi==='bugun' && 'on'" @click="calc.degerleme_esasi='bugun'">Bugün</button>
                <button type="button" :class="calc.degerleme_esasi==='teslim' && 'on'" @click="calc.degerleme_esasi='teslim'">Teslim tarihi</button>
                <button type="button" :class="calc.degerleme_esasi==='ozel' && 'on'" @click="calc.degerleme_esasi='ozel'">Özel tarih</button>
              </div>
              <input class="input" type="date" x-show="calc.degerleme_esasi==='ozel'" x-model="calc.degerleme_tarihi" style="margin-top:8px">
              <span class="help">Bugünkü değer, bu tarih ile vade arasındaki gerçek gün sayısıyla hesaplanır.</span>
              <span class="err" x-show="calcErr && ['duzenleme_tarihi','degerleme_tarihi'].includes(calcErr.field)" x-text="calcErr && calcErr.message"></span>
            </div>
            <div class="alert" x-show="calcErr && !['nominal','vade_tarihi','yillik_oran','duzenleme_tarihi','degerleme_tarihi'].includes(calcErr.field)" x-text="calcErr && calcErr.message"></div>
            <button class="btn btn-primary btn-block" type="submit" :disabled="calcBusy"><span x-html="icon('calc')"></span>Hesapla</button>
          </form>

          <div class="stack" x-show="calcRes">
            <template x-if="calcRes">
              <div class="stack">
                <div class="hero-value">
                  <div class="label">Bugünkü ekonomik değer</div>
                  <div class="big num" x-text="fmtTL(calcRes.sonuc.bugunku_deger)"></div>
                  <div class="chips">
                    <span class="chip" x-text="(calcRes.evrak_turu==='cek'?'Çek':'Senet') + ' · ' + fmtTL(calcRes.sonuc.nominal)"></span>
                    <span class="chip" x-text="calcRes.sonuc.yontem_adi"></span>
                    <span class="chip" x-text="'%' + prettyTR(calcRes.sonuc.yillik_oran) + ' yıllık'"></span>
                    <span class="chip" x-show="calcRes.sonuc.durum!=='vadeli'" style="background:rgba(251,191,36,.2);color:#fde68a" x-text="calcRes.sonuc.durum==='bugun' ? 'Vadesi bugün' : 'Vadesi geçmiş'"></span>
                  </div>
                </div>
                <div class="note" x-show="calcRes.sonuc.durum!=='vadeli'">
                  <span x-show="calcRes.sonuc.durum==='bugun'">Evrakın vadesi değerleme tarihine eşit. Tutar bugün tahsil edilebilir olduğundan iskonto uygulanmaz; bugünkü değer nominal değere eşittir.</span>
                  <span x-show="calcRes.sonuc.durum==='vadesi_gecmis'" x-text="'Evrakın vadesi ' + Math.abs(calcRes.sonuc.gun) + ' gün önce dolmuş. İskonto uygulanmaz; tutar tahsil edilmeli. Gecikmenin maliyeti bu hesaba dahil değildir.'"></span>
                </div>
                  <div class="card">
                    <div class="card-h"><h3>Sonuç</h3><span class="hint" x-text="'Değerleme: ' + fmtDate(calcRes.sonuc.degerleme_tarihi)"></span></div>
                    <div class="metrics">
                      <div class="metric"><span class="k">1. Nominal değer</span><span class="v num" x-text="fmtTL(calcRes.sonuc.nominal)"></span></div>
                      <div class="metric"><span class="k">2. Vadeye kalan gün</span><span class="v num" x-text="calcRes.sonuc.gun + ' gün'"></span></div>
                      <div class="metric"><span class="k">3. Kalan ay ve gün</span><span class="v num" x-text="calcRes.sonuc.ay + ' ay ' + calcRes.sonuc.kalan_gun + ' gün'"></span></div>
                      <div class="metric"><span class="k">4. Yıllık iskonto oranı</span><span class="v num" x-text="fmtPct(calcRes.sonuc.yillik_oran)"></span></div>
                      <div class="metric"><span class="k">5. Bugünkü değer</span><span class="v num value" x-text="fmtTL(calcRes.sonuc.bugunku_deger)"></span></div>
                      <div class="metric"><span class="k">6. Zaman maliyeti</span><span class="v num cost" x-text="fmtTL(calcRes.sonuc.zaman_maliyeti)"></span></div>
                      <div class="metric"><span class="k">7. Değer kaybı</span><span class="v num" x-text="fmtPct(calcRes.sonuc.deger_kaybi_yuzde)"></span></div>
                      <div class="metric"><span class="k">Vade boyunca maliyet</span><span class="v num" x-text="fmtPct(calcRes.sonuc.donem_maliyet_yuzde)"></span></div>
                      <div class="metric"><span class="k">8. Aylık eşdeğer (bileşik)</span><span class="v num" x-text="fmtPct(calcRes.sonuc.efektif_aylik_yuzde)"></span></div>
                      <div class="metric"><span class="k">8. Yıllık efektif eşdeğer</span><span class="v num" x-text="fmtPct(calcRes.sonuc.efektif_yillik_yuzde)"></span></div>
                    </div>
                    <p class="faint" style="font-size:11.5px; margin:12px 0 0">Aylık basit eşdeğer (yıllık oran ÷ 12): <span class="num" x-text="fmtPct(calcRes.sonuc.basit_aylik_yuzde)"></span></p>
                  </div>
                <div class="grid g-2">
                  <div class="card">
                    <div class="card-h"><h3>Değerin bileşimi</h3></div>
                    <div class="chart-box sm"><canvas id="calcDonut"></canvas></div>
                  </div>
                  <div class="card">
                    <div class="card-h"><h3>Basit / bileşik karşılaştırması</h3></div>
                    <div>
                      <div class="row" style="justify-content:space-between; margin-top:8px">
                        <span x-text="calcRes.sonuc.yontem_adi"></span><b class="num" x-text="fmtTL(calcRes.sonuc.bugunku_deger)"></b>
                      </div>
                      <div class="row" style="justify-content:space-between; margin-top:4px">
                        <span x-text="calcRes.diger_yontem.yontem_adi"></span><b class="num" x-text="fmtTL(calcRes.diger_yontem.bugunku_deger)"></b>
                      </div>
                      <div class="row" style="justify-content:space-between; margin-top:4px">
                        <span class="muted">Fark</span><span class="num muted" x-text="fmtTL(calcRes.yontem_farki)"></span>
                      </div>
                      <div class="row" style="justify-content:space-between; margin-top:4px">
                        <span class="muted">Diğer yöntemde maliyet</span><span class="num muted" x-text="fmtTL(calcRes.diger_yontem.zaman_maliyeti)"></span>
                      </div>
                      <div class="note" style="margin-top:16px">Vade 1 yıldan kısaysa basit iskonto daha düşük, 1 yıldan uzunsa daha yüksek bugünkü değer verir; tam 1 yılda iki yöntem eşittir. Bileşik yöntem, ara dönemde paranın yeniden değerlendirilebileceğini varsayar ve finansal açıdan tutarlı olduğu için varsayılandır.</div>
                    </div>
                  </div>
                </div>
                <div class="row" style="justify-content:flex-end">
                  <button class="btn btn-ghost" @click="saveCalcAsDoc()" :disabled="!companies.length" :title="companies.length ? '' : 'Önce bir firma oluşturun'"><span x-html="icon('save')"></span>Portföye kaydet</button>
                </div>
              </div>
            </template>
          </div>
        </div>
      </section>

      <!-- ================= PORTFÖY ================= -->
      <section x-show="page==='portfoy' && companies.length">
        <div class="grid g-4" x-show="port">
          <div class="card kpi accent"><div class="label">Toplam nominal alacak</div><div class="val num" x-text="port && fmtTL(port.toplam_nominal)"></div><div class="foot" x-text="port && (port.adet + ' evrak portföyde')"></div></div>
          <div class="card kpi"><div class="label"><span class="dot" style="background:var(--value)"></span>Toplam bugünkü değer</div><div class="val num value" x-text="port && fmtTL(port.toplam_bugunku_deger)"></div><div class="foot" x-text="port && (port.senaryo_orani ? ('Senaryo: tümü %' + prettyTR(port.senaryo_orani)) : 'Evrak bazında kayıtlı oranlarla')"></div></div>
          <div class="card kpi"><div class="label"><span class="dot" style="background:var(--cost)"></span>Toplam zaman maliyeti</div><div class="val num cost" x-text="port && fmtTL(port.toplam_zaman_maliyeti)"></div><div class="foot" x-text="port && ('Değer kaybı ' + fmtPct(port.deger_kaybi_yuzde))"></div></div>
          <div class="card kpi"><div class="label"><span class="dot" style="background:var(--primary)"></span>Ortalama vade</div><div class="val num" x-text="port && (port.agirlikli_ortalama_vade_gun !== null ? prettyTR(port.agirlikli_ortalama_vade_gun) + ' gün' : '—')"></div><div class="foot" x-text="port && port.ortalama_vade_gun !== null ? ('Tutar ağırlıklı · basit ort. ' + prettyTR(port.ortalama_vade_gun) + ' gün') : 'Portföy boş'"></div></div>
        </div>

        <div class="grid g-2" style="margin-top:20px" x-show="port && port.adet">
          <div class="card"><div class="card-h"><h3>Aylara göre tahsilat beklentisi</h3></div><div class="chart-box"><canvas id="monthlyChart"></canvas></div></div>
          <div class="card"><div class="card-h"><h3>Vade dağılımı</h3></div><div class="chart-box"><canvas id="bucketChart"></canvas></div></div>
        </div>

        <div class="card" style="margin-top:20px">
          <div class="card-h" style="flex-wrap:wrap">
            <div class="row">
              <div class="seg-filter">
                <button :class="docFilter==='portfoyde' && 'on'" @click="docFilter='portfoyde'">Portföyde</button>
                <button :class="docFilter==='tahsil_edildi' && 'on'" @click="docFilter='tahsil_edildi'">Tahsil edilen</button>
                <button :class="docFilter==='iade' && 'on'" @click="docFilter='iade'">İade</button>
                <button :class="docFilter==='hepsi' && 'on'" @click="docFilter='hepsi'">Tümü</button>
              </div>
              <input class="input" style="width:220px" placeholder="Evrak no veya müşteri ara…" x-model="docSearch">
            </div>
            <div class="row">
              <label class="muted" style="font-size:12.5px">Değerleme</label>
              <input class="input" type="date" style="width:auto" x-model="portDate" @change="loadPortfolio()">
              <div class="input-affix" style="width:150px" title="Tüm portföyü tek bir oranla yeniden değerle (senaryo)"><input class="input" placeholder="Senaryo oranı" x-model="portRate" @change="loadPortfolio()"><span class="affix">%</span></div>
              <button class="btn btn-primary" @click="newDoc()"><span x-html="icon('plus')"></span>Evrak ekle</button>
            </div>
          </div>
          <div class="alert" x-show="portErr" x-text="portErr"></div>
          <template x-if="!filteredDocs.length">
            <div class="empty"><div class="ic" x-html="icon('wallet')"></div><h3>Bu listede evrak yok</h3><p>“Evrak ekle” ile yeni bir çek veya senet kaydedin.</p></div>
          </template>
          <div class="table-wrap" x-show="filteredDocs.length">
            <table class="t">
              <thead><tr>
                <th>Evrak no</th><th>Müşteri / firma</th><th>Tür</th><th class="r">Nominal</th><th>Vade</th><th>Kalan</th><th class="r">Oran</th><th class="r">Bugünkü değer</th><th class="r">Zaman maliyeti</th><th></th>
              </tr></thead>
              <tbody>
                <template x-for="d in filteredDocs" :key="d.id">
                  <tr>
                    <td><b x-text="d.evrak_no"></b></td>
                    <td x-text="d.muhatap"></td>
                    <td><span class="chip gray" x-text="d.evrak_turu==='cek'?'Çek':'Senet'"></span></td>
                    <td class="r num" x-text="fmtTL(d.nominal)"></td>
                    <td class="num" x-text="fmtDate(d.vade_tarihi)"></td>
                    <td><span class="chip" :class="statusChip(d).cls" x-text="statusChip(d).text"></span></td>
                    <td class="r num" x-text="fmtPct(d.yillik_oran) + (d.yontem==='basit' ? ' B' : '')"></td>
                    <td class="r num value" x-text="fmtTL(d.guncel.bugunku_deger)"></td>
                    <td class="r num cost" x-text="fmtTL(d.guncel.zaman_maliyeti)"></td>
                    <td class="r" style="white-space:nowrap">
                      <button class="icon-btn" title="Tahsil edildi" x-show="d.durum==='portfoyde'" @click="markCollected(d)" x-html="icon('check')"></button>
                      <button class="icon-btn" title="Düzenle" @click="editDoc(d)" x-html="icon('edit')"></button>
                      <button class="icon-btn" title="Sil" @click="askDelete(d)" x-html="icon('trash')"></button>
                    </td>
                  </tr>
                </template>
              </tbody>
              <tfoot><tr>
                <td colspan="3" x-text="'Toplam (' + filteredDocs.length + ' evrak)'"></td>
                <td class="r num" x-text="fmtTL(sumDocs('nominal'))"></td>
                <td colspan="3"></td>
                <td class="r num" x-text="fmtTL(sumDocs('bugunku_deger'))"></td>
                <td class="r num" x-text="fmtTL(sumDocs('zaman_maliyeti'))"></td>
                <td></td>
              </tr></tfoot>
            </table>
          </div>
          <p class="faint" style="font-size:11.5px; margin:12px 0 0">Tablodaki değerler her evrakın kendi kayıtlı oranı ve yöntemiyle, seçilen değerleme tarihine göre yeniden hesaplanır. “B” basit iskonto yöntemini gösterir.</p>
        </div>
      </section>

      <!-- ================= ORAN KARŞILAŞTIRMASI ================= -->
      <section x-show="page==='oran'">
        <div class="card">
          <form class="grid g-4" style="align-items:end" @submit.prevent="runRates()">
            <div class="field" style="margin:0"><label>Nominal tutar</label><div class="input-affix"><input class="input num" x-model="rate.nominal" @blur="blurPretty(rate,'nominal')" @change="runRates()"><span class="affix">TL</span></div></div>
            <div class="field" style="margin:0"><label>Vade tarihi</label><input class="input" type="date" x-model="rate.vade_tarihi" @change="runRates()"></div>
            <div class="field" style="margin:0"><label>Yöntem</label>
              <div class="seg"><button type="button" :class="rate.yontem==='bilesik'&&'on'" @click="rate.yontem='bilesik'; runRates()">Bileşik</button><button type="button" :class="rate.yontem==='basit'&&'on'" @click="rate.yontem='basit'; runRates()">Basit</button></div>
            </div>
            <div class="field" style="margin:0"><label>Hızlı vade</label>
              <div class="quick"><template x-for="m in [1,3,6,8,12]"><button type="button" @click="setMonths(rate,m); runRates()" x-text="m+' ay'"></button></template></div>
            </div>
          </form>
          <div class="row" style="margin-top:18px">
            <span class="muted" style="font-size:12.5px; font-weight:600">Oranlar</span>
            <div class="rate-chips">
              <template x-for="r in rate.oranlar" :key="r"><span class="rate-chip"><span x-text="'%' + prettyTR(r)"></span><button @click="removeRate(r)" x-html="icon('x')" style="width:20px"></button></span></template>
            </div>
            <form class="row" @submit.prevent="addRate()"><div class="input-affix" style="width:120px"><input class="input" placeholder="Oran ekle" x-model="rate.yeni"><span class="affix">%</span></div><button class="btn btn-ghost btn-sm" type="submit"><span x-html="icon('plus')"></span>Ekle</button></form>
          </div>
          <div class="alert" style="margin-top:14px" x-show="rateErr" x-text="rateErr && rateErr.message"></div>
        </div>

        <template x-if="rateRes">
          <div class="grid g-2" style="margin-top:20px">
            <div class="card">
              <div class="card-h"><h3>Bugünkü değer ve zaman maliyeti</h3><span class="hint" x-text="rateRes.length && (rateRes[0].gun + ' gün · ' + rateRes[0].ay + ' ay ' + rateRes[0].kalan_gun + ' gün')"></span></div>
              <div class="chart-box" style="height:360px"><canvas id="rateChart"></canvas></div>
            </div>
            <div class="card">
              <div class="card-h"><h3>Karşılaştırma tablosu</h3><span class="hint" x-text="(rate.yontem==='bilesik'?'Bileşik':'Basit') + ' iskonto'"></span></div>
              <div class="table-wrap">
                <table class="t">
                  <thead><tr><th>Oran</th><th class="r">Bugünkü değer</th><th class="r">Zaman maliyeti</th><th class="r">Kayıp</th><th>Etki</th></tr></thead>
                  <tbody>
                    <template x-for="r in rateRes" :key="r.yillik_oran">
                      <tr>
                        <td><b x-text="'%' + prettyTR(r.yillik_oran)"></b></td>
                        <td class="r num value" x-text="fmtTL(r.bugunku_deger)"></td>
                        <td class="r num cost" x-text="fmtTL(r.zaman_maliyeti)"></td>
                        <td class="r num" x-text="fmtPct(r.deger_kaybi_yuzde)"></td>
                        <td class="bar-cell"><div class="bar-bg"><div class="bar-fill" :style="'width:' + (Number(r.zaman_maliyeti)/rateMaxCost()*100) + '%; background:linear-gradient(90deg,#fb7185,#e11d48)'"></div></div></td>
                      </tr>
                    </template>
                  </tbody>
                </table>
              </div>
              <p class="faint" style="font-size:11.5px; margin:12px 0 0" x-show="rateRes.length">
                Diğer yöntemle (<span x-text="rate.yontem==='bilesik'?'basit':'bileşik'"></span>) %<span x-text="prettyTR(rateRes[rateRes.length-1].yillik_oran)"></span> oranında bugünkü değer: <span class="num" x-text="fmtTL(rateRes[rateRes.length-1].diger_yontem_bugunku_deger)"></span>
              </p>
            </div>
          </div>
        </template>
      </section>

      <!-- ================= PEŞİN / VADELİ ================= -->
      <section x-show="page==='pesin'">
        <div class="grid g-calc">
          <form class="card" @submit.prevent="runCash()">
            <div class="card-h"><h3>Teklif bilgileri</h3></div>
            <div class="field"><label>Vadeli çek / senet tutarı</label><div class="input-affix"><input class="input num" x-model="cash.nominal" @blur="blurPretty(cash,'nominal')"><span class="affix">TL</span></div></div>
            <div class="field"><label>Vade tarihi</label><input class="input" type="date" x-model="cash.vade_tarihi">
              <div class="quick"><template x-for="d in [30,60,90,180,240,365]"><button type="button" @click="setDays(cash,d)" x-text="d+' gün'"></button></template></div></div>
            <div class="field"><label>Yıllık sermaye maliyetiniz</label><div class="input-affix"><input class="input num" x-model="cash.sermaye_maliyeti"><span class="affix">%</span></div><span class="help">Paranın sizin için yıllık getirisi / borçlanma maliyeti (ör. banka kredi faizi).</span></div>
            <div class="field"><label>Teklif edilen peşin tutar</label><div class="input-affix"><input class="input num" x-model="cash.pesin_teklif" @blur="blurPretty(cash,'pesin_teklif')"><span class="affix">TL</span></div></div>
            <div class="field"><label>Yöntem</label><div class="seg"><button type="button" :class="cash.yontem==='bilesik'&&'on'" @click="cash.yontem='bilesik'">Bileşik</button><button type="button" :class="cash.yontem==='basit'&&'on'" @click="cash.yontem='basit'">Basit</button></div></div>
            <div class="alert" x-show="cashErr" x-text="cashErr && cashErr.message"></div>
            <button class="btn btn-primary btn-block" type="submit"><span x-html="icon('scale')"></span>Karşılaştır</button>
          </form>
          <template x-if="cashRes">
            <div class="stack">
              <div class="verdict" :class="cashRes.karar">
                <div class="badge" x-html="icon(cashRes.karar==='pesin' ? 'check' : cashRes.karar==='vadeli' ? 'clock' : 'scale')"></div>
                <div>
                  <h3 x-text="cashRes.karar==='pesin' ? 'Peşin teklif avantajlı' : cashRes.karar==='vadeli' ? 'Vadeli tahsilat avantajlı' : 'İki seçenek eşdeğer'"></h3>
                  <p style="margin:0" x-text="cashRes.aciklama"></p>
                </div>
              </div>
              <div class="grid g-3">
                <div class="card kpi"><div class="label">Eşdeğer peşin tutar</div><div class="val num" x-text="fmtTL(cashRes.esdeger_pesin_tutar)"></div><div class="foot">Bu çek yerine bugün alınması gereken nakit</div></div>
                <div class="card kpi"><div class="label">Peşin teklif</div><div class="val num" x-text="fmtTL(cashRes.pesin_teklif)"></div><div class="foot" x-text="'İma edilen yıllık oran: ' + fmtPct(cashRes.ima_edilen_oran)"></div></div>
                <div class="card kpi"><div class="label">Peşinin ekonomik farkı</div><div class="val num" :class="Number(cashRes.avantaj) >= 0 ? 'value' : 'cost'" x-text="(Number(cashRes.avantaj) > 0 ? '+' : '') + fmtTL(cashRes.avantaj)"></div><div class="foot" x-text="'Bugünkü değere göre ' + fmtPct(cashRes.avantaj_yuzde)"></div></div>
              </div>
              <div class="card"><div class="card-h"><h3>Karşılaştırma</h3><span class="hint" x-text="cashRes.degerleme.gun + ' gün · ' + cashRes.degerleme.yontem_adi"></span></div><div class="chart-box sm"><canvas id="cashChart"></canvas></div></div>
            </div>
          </template>
        </div>
      </section>

      <!-- ================= RAPORLAR ================= -->
      <section x-show="page==='rapor' && companies.length">
        <div class="card no-print">
          <div class="row" style="justify-content:space-between">
            <div class="row">
              <label class="muted" style="font-size:12.5px">Rapor tarihi</label>
              <input class="input" type="date" style="width:auto" x-model="portDate" @change="loadPortfolio()">
              <div class="input-affix" style="width:150px"><input class="input" placeholder="Senaryo oranı" x-model="portRate" @change="loadPortfolio()"><span class="affix">%</span></div>
            </div>
            <div class="row">
              <button class="btn btn-ghost" @click="exportCsv()"><span x-html="icon('download')"></span>Excel'e aktar (CSV)</button>
              <button class="btn btn-primary" @click="window.print()"><span x-html="icon('print')"></span>Yazdır / PDF</button>
            </div>
          </div>
        </div>
        <template x-if="port">
          <div class="stack" style="margin-top:20px">
            <div class="card">
              <div class="row" style="justify-content:space-between; align-items:flex-start">
                <div>
                  <div class="muted" style="font-size:12px; text-transform:uppercase; letter-spacing:.06em">Vadeli alacak portföy raporu</div>
                  <h2 style="font-size:24px; margin-top:4px" x-text="port.firma"></h2>
                  <div class="muted" x-text="'Değerleme tarihi: ' + fmtDate(port.degerleme_tarihi) + (port.senaryo_orani ? ' · Senaryo oranı: %' + prettyTR(port.senaryo_orani) : ' · Evrak bazında kayıtlı oranlar')"></div>
                </div>
                <img src="/static/brand/decisora-logo.png" alt="Decisora Danışmanlık A.Ş." class="report-logo-img">
              </div>
              <div class="grid g-4" style="margin-top:20px">
                <div><div class="muted" style="font-size:12px">Toplam nominal</div><div class="num" style="font-size:20px; font-weight:700" x-text="fmtTL(port.toplam_nominal)"></div></div>
                <div><div class="muted" style="font-size:12px">Bugünkü değer</div><div class="num value" style="font-size:20px; font-weight:700" x-text="fmtTL(port.toplam_bugunku_deger)"></div></div>
                <div><div class="muted" style="font-size:12px">Zaman maliyeti</div><div class="num cost" style="font-size:20px; font-weight:700" x-text="fmtTL(port.toplam_zaman_maliyeti) + ' (' + fmtPct(port.deger_kaybi_yuzde) + ')'"></div></div>
                <div><div class="muted" style="font-size:12px">Ağırlıklı ortalama vade</div><div class="num" style="font-size:20px; font-weight:700" x-text="port.agirlikli_ortalama_vade_gun !== null ? prettyTR(port.agirlikli_ortalama_vade_gun) + ' gün' : '—'"></div></div>
              </div>
              <div style="margin-top:20px" x-show="Number(port.toplam_nominal) > 0">
                <div class="split-bar">
                  <div :style="'width:' + (Number(port.toplam_bugunku_deger)/Number(port.toplam_nominal)*100) + '%; background:var(--value)'"></div>
                  <div :style="'width:' + (Number(port.toplam_zaman_maliyeti)/Number(port.toplam_nominal)*100) + '%; background:var(--cost)'"></div>
                </div>
                <div class="row muted" style="font-size:12px; margin-top:6px; justify-content:space-between"><span>Bugünkü değer</span><span>Zaman maliyeti</span></div>
              </div>
            </div>
            <div class="grid g-2" x-show="port.adet">
              <div class="card"><div class="card-h"><h3>Aylara göre tahsilat</h3></div><div class="chart-box"><canvas id="r_monthlyChart"></canvas></div></div>
              <div class="card"><div class="card-h"><h3>Vade dağılımı</h3></div><div class="chart-box"><canvas id="r_bucketChart"></canvas></div></div>
            </div>
            <div class="grid g-2">
              <div class="card">
                <div class="card-h"><h3>Aylık tahsilat beklentisi</h3></div>
                <div class="table-wrap"><table class="t">
                  <thead><tr><th>Ay</th><th class="r">Adet</th><th class="r">Nominal</th><th class="r">Bugünkü değer</th></tr></thead>
                  <tbody><template x-for="m in port.aylik_tahsilat" :key="m.ay"><tr><td x-text="m.etiket"></td><td class="r num" x-text="m.adet"></td><td class="r num" x-text="fmtTL(m.nominal)"></td><td class="r num value" x-text="fmtTL(m.bugunku_deger)"></td></tr></template></tbody>
                </table></div>
              </div>
              <div class="card">
                <div class="card-h"><h3>Vade dağılımı</h3></div>
                <div class="table-wrap"><table class="t">
                  <thead><tr><th>Vade aralığı</th><th class="r">Adet</th><th class="r">Nominal</th><th class="r">Bugünkü değer</th></tr></thead>
                  <tbody><template x-for="b in port.vade_dagilimi" :key="b.anahtar"><tr><td x-text="b.etiket"></td><td class="r num" x-text="b.adet"></td><td class="r num" x-text="fmtTL(b.nominal)"></td><td class="r num value" x-text="fmtTL(b.bugunku_deger)"></td></tr></template></tbody>
                </table></div>
              </div>
            </div>
            <div class="card">
              <div class="card-h"><h3>Evrak listesi</h3><span class="hint" x-text="port.adet + ' evrak'"></span></div>
              <div class="table-wrap"><table class="t">
                <thead><tr><th>Evrak no</th><th>Müşteri</th><th>Tür</th><th class="r">Nominal</th><th>Vade</th><th class="r">Gün</th><th class="r">Oran</th><th class="r">Bugünkü değer</th><th class="r">Zaman maliyeti</th></tr></thead>
                <tbody><template x-for="d in port.evraklar" :key="d.id"><tr>
                  <td x-text="d.evrak_no"></td><td x-text="d.muhatap"></td><td x-text="d.evrak_turu==='cek'?'Çek':'Senet'"></td>
                  <td class="r num" x-text="fmtTL(d.nominal)"></td><td class="num" x-text="fmtDate(d.vade_tarihi)"></td><td class="r num" x-text="d.guncel.gun"></td>
                  <td class="r num" x-text="fmtPct(d.guncel.yillik_oran)"></td><td class="r num" x-text="fmtTL(d.guncel.bugunku_deger)"></td><td class="r num" x-text="fmtTL(d.guncel.zaman_maliyeti)"></td>
                </tr></template></tbody>
                <tfoot><tr><td colspan="3">Toplam</td><td class="r num" x-text="fmtTL(port.toplam_nominal)"></td><td colspan="3"></td><td class="r num" x-text="fmtTL(port.toplam_bugunku_deger)"></td><td class="r num" x-text="fmtTL(port.toplam_zaman_maliyeti)"></td></tr></tfoot>
              </table></div>
            </div>
            <p class="faint" style="font-size:11.5px">Bu rapor, vadeli alacakların seçilen tarihteki bugünkü ekonomik değerini gösterir. Vadesi geçmiş veya bugün olan evraklar nominal değerle dikkate alınır. Hesaplamalar gerçek gün sayısı ve 365 günlük yıl esasına göre yapılmıştır.<br>Hazırlayan: <b>Decisora Danışmanlık A.Ş.</b> · Paranın Zaman Maliyeti</p>
          </div>
        </template>
      </section>

      <!-- ================= AYARLAR ================= -->
      <section x-show="page==='ayar'">
        <div class="stack">
          <div class="card">
            <div class="card-h"><h3>Firmalar</h3><button class="btn btn-primary btn-sm" x-show="user.yonetici" @click="openCompany(null)"><span x-html="icon('plus')"></span>Firma ekle</button></div>
            <p class="muted" style="margin:-8px 0 14px; font-size:13px">Her firmanın portföyü, varsayılan iskonto oranı ve değerleme esası ayrıdır.</p>
            <div class="table-wrap"><table class="t">
              <thead><tr><th>Firma</th><th>Vergi no</th><th class="r">Varsayılan oran</th><th>Yöntem</th><th>Değerleme esası</th><th class="r">Portföy</th><th></th></tr></thead>
              <tbody>
                <template x-for="c in companies" :key="c.id"><tr :class="c.id===companyId && 'hl'">
                  <td><b x-text="c.ad"></b></td><td x-text="c.vergi_no || '—'"></td><td class="r num" x-text="fmtPct(c.varsayilan_oran)"></td>
                  <td x-text="c.varsayilan_yontem==='bilesik'?'Bileşik':'Basit'"></td><td x-text="c.degerleme_esasi==='bugun'?'Bugün':'Teslim tarihi'"></td>
                  <td class="r num" x-text="c.evrak_sayisi + ' evrak'"></td>
                  <td class="r" style="white-space:nowrap"><button class="icon-btn" title="Düzenle" @click="openCompany(c)" x-html="icon('edit')"></button><button class="icon-btn" title="Sil" x-show="user.yonetici" @click="askDeleteCompany(c)" x-html="icon('trash')"></button></td>
                </tr></template>
              </tbody>
            </table></div>
          </div>
          <div class="card" x-show="user.yonetici">
            <div class="card-h"><h3>Kullanıcılar</h3><button class="btn btn-primary btn-sm" @click="openUser(null)"><span x-html="icon('plus')"></span>Kullanıcı ekle</button></div>
            <p class="muted" style="margin:-8px 0 14px; font-size:13px">Firma kullanıcıları yalnızca kendilerine atanan firmaların portföyünü görür. Yöneticiler tüm firmaları yönetir.</p>
            <div class="table-wrap"><table class="t">
              <thead><tr><th>Ad soyad</th><th>Kullanıcı adı</th><th>Rol</th><th>Firmalar</th><th>Durum</th><th></th></tr></thead>
              <tbody><template x-for="u in users" :key="u.id"><tr>
                <td><b x-text="u.ad_soyad"></b></td><td x-text="u.kullanici_adi"></td>
                <td><span class="chip" :class="u.yonetici ? '' : 'gray'" x-text="u.yonetici ? 'Yönetici' : 'Kullanıcı'"></span></td>
                <td x-text="u.yonetici ? 'Tümü' : companyNames(u.firmalar)"></td>
                <td><span class="chip" :class="u.aktif ? 'value' : 'cost'" x-text="u.aktif ? 'Aktif' : 'Pasif'"></span></td>
                <td class="r" style="white-space:nowrap"><button class="icon-btn" @click="openUser(u)" x-html="icon('edit')"></button><button class="icon-btn" x-show="u.id!==user.id" @click="askDeleteUser(u)" x-html="icon('trash')"></button></td>
              </tr></template></tbody>
            </table></div>
          </div>
          <div class="grid g-2">
            <form class="card" @submit.prevent="changePassword()">
              <div class="card-h"><h3>Parola değiştir</h3></div>
              <div class="field"><label>Mevcut parola</label><input class="input" type="password" x-model="pw.mevcut_parola" autocomplete="current-password"></div>
              <div class="two">
                <div class="field"><label>Yeni parola</label><input class="input" type="password" x-model="pw.yeni_parola" autocomplete="new-password"></div>
                <div class="field"><label>Yeni parola (tekrar)</label><input class="input" type="password" x-model="pw.tekrar" autocomplete="new-password"></div>
              </div>
              <button class="btn btn-ghost" type="submit">Parolayı güncelle</button>
            </form>
            <div class="card">
              <div class="card-h"><h3>Görünüm</h3></div>
              <div class="field"><label>Tema</label>
                <div class="seg"><button :class="theme==='light'&&'on'" @click="theme!=='light' && toggleTheme()">Açık</button><button :class="theme==='dark'&&'on'" @click="theme!=='dark' && toggleTheme()">Koyu</button></div>
              </div>
              <div class="note">Hesaplama esasları: gerçek gün sayısı / 365 gün, kuruş düzeyinde yarım yukarı yuvarlama, 40 haneli ondalık hassasiyet. Ayrıntılar için proje dokümantasyonuna bakınız.</div>
            </div>
          </div>
        </div>
      </section>
    </div>
  </main>

  <!-- ===== Evrak modalı ===== -->
  <template x-if="docModal">
    <div class="modal-bg" @click.self="docModal=null" @keydown.escape.window="docModal=null">
      <form class="modal" @submit.prevent="saveDoc()">
        <h3 x-text="docModal.id ? 'Evrakı düzenle' : 'Portföye evrak ekle'"></h3>
        <div class="alert" x-show="docErr" x-text="docErr && docErr.message"></div>
        <div class="two">
          <div class="field"><label>Evrak türü</label><div class="seg"><button type="button" :class="docModal.evrak_turu==='cek'&&'on'" @click="docModal.evrak_turu='cek'">Çek</button><button type="button" :class="docModal.evrak_turu==='senet'&&'on'" @click="docModal.evrak_turu='senet'">Senet</button></div></div>
          <div class="field"><label>Evrak numarası</label><input class="input" x-model="docModal.evrak_no" required></div>
        </div>
        <div class="field"><label>Müşteri / firma adı</label><input class="input" x-model="docModal.muhatap" required></div>
        <div class="two">
          <div class="field"><label>Nominal tutar</label><div class="input-affix"><input class="input num" x-model="docModal.nominal" @blur="blurPretty(docModal,'nominal')" required><span class="affix">TL</span></div></div>
          <div class="field"><label>Yıllık iskonto oranı</label><div class="input-affix"><input class="input num" x-model="docModal.yillik_oran" required><span class="affix">%</span></div></div>
        </div>
        <div class="two">
          <div class="field"><label>Düzenleme / teslim tarihi</label><input class="input" type="date" x-model="docModal.duzenleme_tarihi"></div>
          <div class="field"><label>Vade tarihi</label><input class="input" type="date" x-model="docModal.vade_tarihi" required></div>
        </div>
        <div class="two">
          <div class="field"><label>Yöntem</label><div class="seg"><button type="button" :class="docModal.yontem==='bilesik'&&'on'" @click="docModal.yontem='bilesik'">Bileşik</button><button type="button" :class="docModal.yontem==='basit'&&'on'" @click="docModal.yontem='basit'">Basit</button></div></div>
          <div class="field"><label>Durum</label><select class="input" x-model="docModal.durum"><option value="portfoyde">Portföyde</option><option value="tahsil_edildi">Tahsil edildi</option><option value="iade">İade / karşılıksız</option></select></div>
        </div>
        <div class="field"><label>Banka / şube (isteğe bağlı)</label><input class="input" x-model="docModal.banka"></div>
        <div class="field"><label>Not</label><textarea class="input" rows="2" x-model="docModal.notlar"></textarea></div>
        <div class="modal-actions"><button type="button" class="btn btn-ghost" @click="docModal=null">Vazgeç</button><button class="btn btn-primary" type="submit" :disabled="docBusy">Kaydet</button></div>
      </form>
    </div>
  </template>

  <!-- ===== Firma modalı ===== -->
  <template x-if="companyModal">
    <div class="modal-bg" @click.self="companyModal=null">
      <form class="modal" @submit.prevent="saveCompany()">
        <h3 x-text="companyModal.id ? 'Firmayı düzenle' : 'Yeni firma'"></h3>
        <div class="alert" x-show="modalErr" x-text="modalErr"></div>
        <div class="two">
          <div class="field"><label>Firma adı</label><input class="input" x-model="companyModal.ad" required></div>
          <div class="field"><label>Vergi no (isteğe bağlı)</label><input class="input" x-model="companyModal.vergi_no"></div>
        </div>
        <div class="two">
          <div class="field"><label>Varsayılan yıllık oran / sermaye maliyeti</label><div class="input-affix"><input class="input num" x-model="companyModal.varsayilan_oran"><span class="affix">%</span></div></div>
          <div class="field"><label>Varsayılan yöntem</label><div class="seg"><button type="button" :class="companyModal.varsayilan_yontem==='bilesik'&&'on'" @click="companyModal.varsayilan_yontem='bilesik'">Bileşik</button><button type="button" :class="companyModal.varsayilan_yontem==='basit'&&'on'" @click="companyModal.varsayilan_yontem='basit'">Basit</button></div></div>
        </div>
        <div class="field"><label>Yeni hesaplamada değerleme esası</label><div class="seg"><button type="button" :class="companyModal.degerleme_esasi==='bugun'&&'on'" @click="companyModal.degerleme_esasi='bugun'">Bugünün tarihi</button><button type="button" :class="companyModal.degerleme_esasi==='teslim'&&'on'" @click="companyModal.degerleme_esasi='teslim'">Teslim alma tarihi</button></div></div>
        <div class="modal-actions"><button type="button" class="btn btn-ghost" @click="companyModal=null">Vazgeç</button><button class="btn btn-primary" type="submit">Kaydet</button></div>
      </form>
    </div>
  </template>

  <!-- ===== Kullanıcı modalı ===== -->
  <template x-if="userModal">
    <div class="modal-bg" @click.self="userModal=null">
      <form class="modal" @submit.prevent="saveUser()">
        <h3 x-text="userModal.id ? 'Kullanıcıyı düzenle' : 'Yeni kullanıcı'"></h3>
        <div class="alert" x-show="modalErr" x-text="modalErr"></div>
        <div class="two">
          <div class="field"><label>Ad soyad</label><input class="input" x-model="userModal.ad_soyad" required></div>
          <div class="field"><label>Kullanıcı adı</label><input class="input" x-model="userModal.kullanici_adi" :disabled="userModal.id" required></div>
        </div>
        <div class="field"><label x-text="userModal.id ? 'Yeni parola (değiştirmek için)' : 'Parola'"></label><input class="input" type="password" x-model="userModal.parola" autocomplete="new-password" :required="!userModal.id"><span class="help">En az 8 karakter.</span></div>
        <div class="two">
          <div class="field"><label>Rol</label><div class="seg"><button type="button" :class="!userModal.yonetici&&'on'" @click="userModal.yonetici=false">Kullanıcı</button><button type="button" :class="userModal.yonetici&&'on'" @click="userModal.yonetici=true">Yönetici</button></div></div>
          <div class="field"><label>Durum</label><div class="seg"><button type="button" :class="userModal.aktif&&'on'" @click="userModal.aktif=true">Aktif</button><button type="button" :class="!userModal.aktif&&'on'" @click="userModal.aktif=false">Pasif</button></div></div>
        </div>
        <div class="field" x-show="!userModal.yonetici"><label>Erişebileceği firmalar</label>
          <div class="stack" style="gap:6px">
            <template x-for="c in companies" :key="c.id"><label class="row" style="gap:8px; font-weight:500; color:var(--text)"><input type="checkbox" :value="c.id" :checked="userModal.firmalar.includes(c.id)" @change="$event.target.checked ? userModal.firmalar.push(c.id) : userModal.firmalar = userModal.firmalar.filter(x=>x!==c.id)"><span x-text="c.ad"></span></label></template>
          </div>
        </div>
        <div class="modal-actions"><button type="button" class="btn btn-ghost" @click="userModal=null">Vazgeç</button><button class="btn btn-primary" type="submit">Kaydet</button></div>
      </form>
    </div>
  </template>

  <!-- ===== Onay ===== -->
  <template x-if="confirmBox">
    <div class="modal-bg" @click.self="confirmBox=null">
      <div class="modal" style="width:min(420px,100%)">
        <h3>Emin misiniz?</h3>
        <p x-text="confirmBox.text"></p>
        <div class="modal-actions"><button class="btn btn-ghost" @click="confirmBox=null">Vazgeç</button><button class="btn btn-danger" @click="runConfirm()">Sil</button></div>
      </div>
    </div>
  </template>
</div>
</template>

<div class="toast-wrap">
  <template x-for="t in toasts" :key="t.id"><div class="toast" :class="t.err && 'err'" x-text="t.msg"></div></template>
</div>
</body>
</html>
